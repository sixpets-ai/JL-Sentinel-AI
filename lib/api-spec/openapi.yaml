openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: santi
    description: SANTI Centro de Mando Operativo
  - name: gemini
    description: Gemini AI chat and image operations
paths:
  /global/tactical:
    get:
      operationId: getTacticalScenario
      responses:
        "200":
          description: Explicitly synthetic hackathon scenario processed by Python
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalScenario" }
  /global/tactical/alerts:
    get:
      operationId: listTacticalAlerts
      responses:
        "200":
          description: Own persisted demonstration alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TacticalAlert" }
    post:
      operationId: createTacticalAlert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TacticalAlertInput" }
      responses:
        "201":
          description: Persisted simulated alert, route result and preliminary report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalAlert" }
  /global/tactical/alerts/{id}/report:
    post:
      operationId: retryTacticalReport
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Regenerated own preliminary executive report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalAlert" }
  /global/auth/register:
    post:
      operationId: registerGlobalUser
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalCredentials" }
      responses:
        "201":
          description: Citizen account and secure cookie created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/login:
    post:
      operationId: loginGlobalUser
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalCredentials" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/me:
    get:
      operationId: getGlobalSession
      tags: [global]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/logout:
    post:
      operationId: logoutGlobalUser
      tags: [global]
      responses:
        "204": { description: Session revoked }
  /global/snapshot:
    get:
      operationId: getGlobalSnapshot
      tags: [global]
      parameters:
        - name: topic
          in: query
          required: true
          schema: { $ref: "#/components/schemas/GlobalTopic" }
      responses:
        "200":
          description: Public source snapshot with provenance and honest availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSnapshot" }
  /global/report:
    post:
      operationId: createGlobalBrief
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalBriefInput" }
      responses:
        "200":
          description: Gemini summary grounded in public source titles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalBrief" }
  /global/briefs:
    get:
      operationId: listGlobalBriefs
      tags: [global]
      parameters:
        - name: topic
          in: query
          required: true
          schema: { $ref: "#/components/schemas/GlobalTopic" }
      responses:
        "200":
          description: Current user's persisted reports for the selected topic
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalBrief" }
  /global/routes:
    post:
      operationId: simulateGlobalRoute
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalRouteInput" }
      responses:
        "200":
          description: Educational route simulation, not dispatch or navigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalRoute" }
  /global/governance:
    get:
      operationId: getGlobalGovernance
      tags: [global]
      responses:
        "200":
          description: Actual IBM monitor status or explicit missing configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalGovernance" }
  /global/audit:
    post:
      operationId: submitGlobalAudit
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalAuditInput" }
      responses:
        "200":
          description: IBM evaluation submission state, never a guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalGovernance" }
  /global/users:
    get:
      operationId: listGlobalUsers
      tags: [global]
      responses:
        "200":
          description: Director only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalUser" }
  /global/users/{id}/role:
    patch:
      operationId: updateGlobalRole
      tags: [global]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalRoleInput" }
      responses:
        "200":
          description: Updated role; existing tokens checked against database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalUser" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /santi/analyze:
    post:
      operationId: analyzeIncident
      tags: [santi]
      summary: Generate a neutral, unverified demo summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnalysisInput"
      responses:
        "200":
          description: AI-generated demo summary; not a risk or operational assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalysis"

  /santi/translate-ui:
    post:
      operationId: translateSantiUi
      tags: [santi]
      summary: Translate SANTI interface labels with Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SantiUiTranslationInput"
      responses:
        "200":
          description: Translated interface labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SantiUiTranslation"

  /santi/reports:
    get:
      operationId: listReports
      tags: [santi]
      summary: List all incident reports
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentReport"
    post:
      operationId: createReport
      tags: [santi]
      summary: Create a new incident report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentReport"

  /santi/stats:
    get:
      operationId: getStats
      tags: [santi]
      summary: Get operational statistics
      responses:
        "200":
          description: Operational stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalStats"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /gemini/generate-image:
    post:
      operationId: generateGeminiImage
      tags: [gemini]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiImageResult"

components:
  schemas:
    TacticalIncident:
      type: object
      required: [id, title, category, impact, lat, lng, mentions, unit]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        impact: { type: string, enum: [alto, medio, bajo] }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        mentions: { type: integer }
        unit: { type: string }
    TacticalHeatPoint:
      type: object
      required: [lat, lng, weight, count]
      properties:
        lat: { type: number }
        lng: { type: number }
        weight: { type: number }
        count: { type: integer }
    TacticalNode:
      type: object
      required: [id, label, kind]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [incident, source, zone] }
    TacticalEdge:
      type: object
      required: [id, source, target, label]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        label: { type: string }
    TacticalScenario:
      type: object
      required: [simulation, disclaimer, incidents, heatpoints, nodes, edges]
      properties:
        simulation: { type: boolean }
        disclaimer: { type: string }
        incidents:
          type: array
          items: { $ref: "#/components/schemas/TacticalIncident" }
        heatpoints:
          type: array
          items: { $ref: "#/components/schemas/TacticalHeatPoint" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TacticalNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TacticalEdge" }
    TacticalAlertInput:
      type: object
      additionalProperties: false
      required: [incidentId]
      properties:
        incidentId: { type: string, minLength: 1, maxLength: 40 }
    TacticalAlert:
      type: object
      required: [id, folio, simulation, createdAt, incident, unit, reportStatus, report, routeStatus, route, disclaimer]
      properties:
        id: { type: string }
        folio: { type: string }
        simulation: { type: boolean }
        createdAt: { type: string }
        incident: { $ref: "#/components/schemas/TacticalIncident" }
        unit: { type: string }
        reportStatus: { type: string, enum: [pending, ready, failed] }
        report: { type: string }
        routeStatus: { type: string, enum: [not_required, ready, failed] }
        route:
          oneOf:
            - { $ref: "#/components/schemas/GlobalRoute" }
            - { type: "null" }
        disclaimer: { type: string }
    GlobalTopic:
      type: string
      enum: [earthquake, flood, wildfire, humanitarian]
    GlobalRole:
      type: string
      enum: [ciudadano, oficial, director]
    GlobalCredentials:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 40, pattern: "^[a-zA-Z0-9_.-]+$" }
        password: { type: string, minLength: 12, maxLength: 128 }
    GlobalUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { $ref: "#/components/schemas/GlobalRole" }
    GlobalSession:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/GlobalUser" }
    GlobalRoleInput:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/GlobalRole" }
    GlobalSource:
      type: object
      required: [name, status, detail]
      properties:
        name: { type: string }
        status: { type: string, enum: [live, cached, unavailable, not_configured] }
        detail: { type: string }
    GlobalEvent:
      type: object
      required: [id, title, source, url, observedAt, lat, lng, mentions, kind]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        url: { type: string }
        observedAt: { type: string }
        publishedAt: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        mentions: { type: number }
        kind: { type: string, enum: [coverage, earthquake, local_demo, social] }
    GlobalSnapshot:
      type: object
      required: [topic, fetchedAt, cached, events, sources, notice]
      properties:
        topic: { $ref: "#/components/schemas/GlobalTopic" }
        fetchedAt: { type: string }
        cached: { type: boolean }
        events:
          type: array
          items: { $ref: "#/components/schemas/GlobalEvent" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/GlobalSource" }
        notice: { type: string }
    GlobalBriefInput:
      type: object
      required: [topic]
      additionalProperties: false
      properties:
        topic: { $ref: "#/components/schemas/GlobalTopic" }
    GlobalBrief:
      type: object
      required: [id, text, createdAt, sourceUrls, auditStatus]
      properties:
        id: { type: integer }
        text: { type: string }
        createdAt: { type: string }
        sourceUrls: { type: array, items: { type: string } }
        auditStatus: { type: string }
    GlobalPoint:
      type: object
      required: [name, lat, lng]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    GlobalRouteInput:
      type: object
      required: [points]
      additionalProperties: false
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: "#/components/schemas/GlobalPoint" }
    GlobalRoute:
      type: object
      required: [points, distanceKm, algorithm, disclaimer]
      properties:
        points:
          type: array
          items: { $ref: "#/components/schemas/GlobalPoint" }
        distanceKm: { type: number }
        algorithm: { type: string }
        disclaimer: { type: string }
    GlobalAuditInput:
      type: object
      required: [prompt, response]
      additionalProperties: false
      properties:
        briefId: { type: integer, minimum: 1 }
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        response: { type: string, minLength: 1, maxLength: 8000 }
    GlobalGovernance:
      type: object
      required: [status, detail, checkedAt, missing, metrics]
      properties:
        status: { type: string, enum: [not_configured, connected, submitted, unavailable] }
        detail: { type: string }
        checkedAt: { type: string }
        missing: { type: array, items: { type: string } }
        runId: { type: ["string", "null"] }
        metrics: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    IncidentAnalysisInput:
      type: object
      properties:
        tipo:
          type: string
        descripcion:
          type: string
        sector:
          type: string
        folio:
          type: string
        agente:
          type: string
        languageCode:
          type: string
          enum: [es, en, fr, de, zh, ru, nahuatl, maya, mixteco, zapoteco, totonaco]
      required:
        - tipo
        - folio

    SantiUiTranslationInput:
      type: object
      properties:
        languageCode:
          type: string
          enum: [en, fr, de, zh, ru, nahuatl, maya, mixteco, zapoteco, totonaco]
        strings:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 500
      required:
        - languageCode
        - strings

    SantiUiTranslation:
      type: object
      properties:
        translations:
          type: object
          additionalProperties:
            type: string
      required:
        - translations

    IncidentAnalysis:
      type: object
      properties:
        folio:
          type: string
        agente:
          type: string
        analisis:
          type: string
        nivelRiesgo:
          type: string
        accionesRecomendadas:
          type: array
          items:
            type: string
        unidadesRequeridas:
          type: integer
        protocolo:
          type: string
        coordinacion:
          type: string
      required:
        - folio
        - agente
        - analisis
        - nivelRiesgo
        - accionesRecomendadas
        - unidadesRequeridas
        - protocolo
        - coordinacion

    IncidentReport:
      type: object
      properties:
        id:
          type: integer
        folio:
          type: string
        tipo:
          type: string
        descripcion:
          type: string
        sector:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        agente:
          type: string
        nivelRiesgo:
          type: string
        analisis:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - folio
        - tipo
        - agente
        - createdAt

    IncidentReportInput:
      type: object
      properties:
        folio:
          type: string
        tipo:
          type: string
        descripcion:
          type: string
        sector:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        agente:
          type: string
        nivelRiesgo:
          type: string
        analisis:
          type: string
      required:
        - folio
        - tipo
        - agente

    OperationalStats:
      type: object
      properties:
        totalReports:
          type: integer
        criticalAlerts:
          type: integer
        activeUnits:
          type: ["integer", "null"]
        resolvedToday:
          type: ["integer", "null"]
        avgResponseMinutes:
          type: ["number", "null"]
        topIncidentType:
          type: ["string", "null"]
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - totalReports
        - criticalAlerts
        - activeUnits
        - resolvedToday
        - avgResponseMinutes
        - topIncidentType
        - recentActivity

    ActivityItem:
      type: object
      properties:
        time:
          type: string
        color:
          type: string
        message:
          type: string
      required:
        - time
        - color
        - message

    GeminiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    GeminiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    GeminiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    GeminiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    GeminiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    GeminiImageInput:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt
    GeminiImageResult:
      type: object
      properties:
        b64_json:
          type: string
        mimeType:
          type: string
      required:
        - b64_json
        - mimeType
    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
