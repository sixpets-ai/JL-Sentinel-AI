openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: santi
    description: SANTI Centro de Mando Operativo
  - name: gemini
    description: Gemini AI chat and image operations
paths:
  /global/patterns:
    get:
      operationId: getPatternAnalysis
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [demo, portal], default: demo } }
        - { name: zone, in: query, schema: { type: string, enum: [all, centro, norte, sur], default: all } }
        - { name: windowDays, in: query, schema: { type: integer, enum: [30, 90, 180], default: 90 } }
        - { name: threshold, in: query, schema: { type: number, minimum: 0.5, maximum: 1, default: 0.8 } }
      responses:
        "200":
          description: Authorized descriptive analysis, not culpability attribution or a crime forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatternAnalysis" }
        "403": { description: "Analyst, legacy official or director required" }
        "503": { description: "Compute unavailable, no fabricated fallback" }
  /global/onboarding/policy:
    get:
      operationId: getOnboardingPolicy
      responses:
        "200":
          description: Informational MVP notices, not a certification or legal opinion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPolicy" }
  /global/onboarding/profile:
    get:
      operationId: getOnboardingProfile
      responses:
        "200":
          description: Own enrollment details only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentProfile" }
    post:
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "200":
          description: Consent recorded; role requests never grant permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentProfile" }
  /global/onboarding/requests:
    get:
      operationId: listEnrollmentRequests
      responses:
        "200":
          description: Director-only requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnrollmentProfile" }
  /global/onboarding/requests/{userId}/decision:
    post:
      operationId: reviewEnrollment
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentDecision" }
      responses:
        "200":
          description: Director-reviewed request; target sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentProfile" }
  /global/citizen/cases:
    get:
      operationId: listCitizenCases
      responses:
        "200":
          description: Own cases for citizens; all for authorized analysts and directors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CitizenCase" }
    post:
      operationId: createCitizenCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenCaseInput" }
      responses:
        "201":
          description: Sealed synthetic exercise, never a real emergency dispatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenCase" }
  /global/citizen/cases/{id}:
    get:
      operationId: getCitizenCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Owner or analyst access; patrol is denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenCase" }
  /global/citizen/cases/{id}/dispatch:
    post:
      operationId: startCitizenDispatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenDispatchInput" }
      responses:
        "200":
          description: Start an explicitly simulated journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenCase" }
  /global/citizen/cases/{id}/close:
    post:
      operationId: closeCitizenCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Append completion without altering original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenCase" }
  /global/citizen/cases/{id}/evidence:
    post:
      operationId: appendCitizenEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenEvidenceInput" }
      responses:
        "201":
          description: Immutable receipt after server verification of privately stored bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenCase" }
  /global/citizen/cases/{id}/uploads:
    post:
      operationId: requestCitizenUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenEvidenceInput" }
      responses:
        "201":
          description: Private temporary PUT URL, not an evidence receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenUploadTicket" }
        "503":
          description: Storage unavailable; do not pretend the file was uploaded
  /global/citizen/evidence/{id}/content:
    get:
      operationId: downloadCitizenEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authenticated owner or analyst/director download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /global/patrol/assignments:
    get:
      operationId: getPatrolAssignments
      responses:
        "200":
          description: Own unit and assigned synthetic nearby alerts; no private case or network data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatrolAssignments" }
  /global/citizen/roster:
    get:
      operationId: listPatrolRoster
      responses:
        "200":
          description: Analysts and directors only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatrolMember" }
  /health/live:
    get:
      operationId: getProcessLiveness
      responses:
        "200":
          description: Process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status, worker]
                properties:
                  status: { type: string }
                  worker: { type: integer }
  /health/ready:
    get:
      operationId: getServiceReadiness
      responses:
        "200":
          description: Core dependencies available; compute may be degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceReadiness" }
        "503":
          description: Core database or shared coordination unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceReadiness" }
  /global/mutation-attempts:
    get:
      operationId: listMutationAttempts
      responses:
        "200":
          description: Director-only immutable audit of rejected mutation attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MutationAttempt" }
  /global/catalog:
    get:
      operationId: getCrimeCatalog
      responses:
        "200":
          description: Versioned statistical categories, not legal equivalence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrimeCatalog" }
  /global/ledger:
    get:
      operationId: listSealedRecords
      responses:
        "200":
          description: Accessible sealed incident records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SealedRecord" }
  /global/ledger/{kind}/{id}:
    parameters:
      - { in: path, name: kind, required: true, schema: { type: string, enum: [tactical, nexus] } }
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 64 } }
    get:
      operationId: getRecordLedger
      responses:
        "200":
          description: Original, append-only history and independently recomputed integrity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordLedger" }
    patch:
      operationId: rejectRecordPatch
      responses:
        "409":
          description: Database rollback followed by independent audit commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationRejected" }
    put:
      operationId: rejectRecordReplacement
      responses:
        "409":
          description: Original cannot be replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationRejected" }
    delete:
      operationId: rejectRecordDeletion
      responses:
        "409":
          description: Original cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationRejected" }
  /global/ledger/{kind}/{id}/validation:
    parameters:
      - { in: path, name: kind, required: true, schema: { type: string, enum: [tactical, nexus] } }
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 64 } }
    post:
      operationId: createAmendmentValidation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentIntent" }
      responses:
        "201":
          description: Five-minute single-use validation simulation, not biometric authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmendmentValidation" }
  /global/ledger/{kind}/{id}/amendments:
    parameters:
      - { in: path, name: kind, required: true, schema: { type: string, enum: [tactical, nexus] } }
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 64 } }
    post:
      operationId: appendRecordAmendment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentInput" }
      responses:
        "201":
          description: Sealed amendment, original unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordLedger" }
  /global/ledger/{kind}/{id}/evidence:
    parameters:
      - { in: path, name: kind, required: true, schema: { type: string, enum: [tactical, nexus] } }
      - { in: path, name: id, required: true, schema: { type: string, maxLength: 64 } }
    post:
      operationId: appendRecordEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceReferenceInput" }
      responses:
        "201":
          description: Append-only digital custody reference, files are not fetched or authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordLedger" }
  /global/tactical:
    get:
      operationId: getTacticalScenario
      responses:
        "200":
          description: Explicitly synthetic hackathon scenario processed by Python
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalScenario" }
  /global/tactical/alerts:
    get:
      operationId: listTacticalAlerts
      responses:
        "200":
          description: Own persisted demonstration alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TacticalAlert" }
    post:
      operationId: createTacticalAlert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TacticalAlertInput" }
      responses:
        "201":
          description: Persisted simulated alert, route result and preliminary report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalAlert" }
  /global/tactical/alerts/{id}/report:
    post:
      operationId: retryTacticalReport
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Regenerated own preliminary executive report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacticalAlert" }
  /global/auth/register:
    post:
      operationId: registerGlobalUser
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalCredentials" }
      responses:
        "201":
          description: Citizen account and secure cookie created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/login:
    post:
      operationId: loginGlobalUser
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalCredentials" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/me:
    get:
      operationId: getGlobalSession
      tags: [global]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSession" }
  /global/auth/logout:
    post:
      operationId: logoutGlobalUser
      tags: [global]
      responses:
        "204": { description: Session revoked }
  /global/snapshot:
    get:
      operationId: getGlobalSnapshot
      tags: [global]
      parameters:
        - name: topic
          in: query
          required: true
          schema: { $ref: "#/components/schemas/GlobalTopic" }
      responses:
        "200":
          description: Public source snapshot with provenance and honest availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalSnapshot" }
  /global/report:
    post:
      operationId: createGlobalBrief
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalBriefInput" }
      responses:
        "200":
          description: Gemini summary grounded in public source titles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalBrief" }
  /global/briefs:
    get:
      operationId: listGlobalBriefs
      tags: [global]
      parameters:
        - name: topic
          in: query
          required: true
          schema: { $ref: "#/components/schemas/GlobalTopic" }
      responses:
        "200":
          description: Current user's persisted reports for the selected topic
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalBrief" }
  /global/routes:
    post:
      operationId: simulateGlobalRoute
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalRouteInput" }
      responses:
        "200":
          description: Educational route simulation, not dispatch or navigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalRoute" }
  /global/governance:
    get:
      operationId: getGlobalGovernance
      tags: [global]
      responses:
        "200":
          description: Actual IBM monitor status or explicit missing configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalGovernance" }
  /global/audit:
    post:
      operationId: submitGlobalAudit
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalAuditInput" }
      responses:
        "200":
          description: IBM evaluation submission state, never a guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalGovernance" }
  /global/users:
    get:
      operationId: listGlobalUsers
      tags: [global]
      responses:
        "200":
          description: Director only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalUser" }
  /global/users/{id}/role:
    patch:
      operationId: updateGlobalRole
      tags: [global]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalRoleInput" }
      responses:
        "200":
          description: Updated role; existing tokens checked against database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalUser" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /santi/analyze:
    post:
      operationId: analyzeIncident
      tags: [santi]
      summary: Generate a neutral, unverified demo summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnalysisInput"
      responses:
        "200":
          description: AI-generated demo summary; not a risk or operational assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalysis"

  /santi/translate-ui:
    post:
      operationId: translateSantiUi
      tags: [santi]
      summary: Translate SANTI interface labels with Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SantiUiTranslationInput"
      responses:
        "200":
          description: Translated interface labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SantiUiTranslation"

  /santi/reports:
    get:
      operationId: listReports
      tags: [santi]
      summary: List all incident reports
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentReport"
    post:
      operationId: createReport
      tags: [santi]
      summary: Create a new incident report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentReport"

  /santi/stats:
    get:
      operationId: getStats
      tags: [santi]
      summary: Get operational statistics
      responses:
        "200":
          description: Operational stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalStats"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /gemini/generate-image:
    post:
      operationId: generateGeminiImage
      tags: [gemini]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiImageResult"

components:
  schemas:
    ServiceReadiness:
      type: object
      required: [status, worker, database, redis, heatmap, quantum]
      properties:
        status: { type: string, enum: [ready, degraded, unavailable] }
        worker: { type: integer }
        database: { type: boolean }
        redis: { type: boolean }
        heatmap: { type: boolean }
        quantum: { type: boolean }
    MutationAttempt:
      type: object
      required: [id, requestId, stream, operation, actorId, actor, outcome, createdAt]
      properties:
        id: { type: integer }
        requestId: { type: string }
        stream: { type: string }
        operation: { type: string }
        actorId: { type: integer }
        actor: { type: string }
        outcome: { type: string }
        createdAt: { type: string }
    MutationRejected:
      type: object
      required: [error, requestId, recorded]
      properties:
        error: { type: string }
        requestId: { type: string }
        recorded: { type: boolean }
    CrimeCatalogEntry:
      type: object
      required: [code, label, system, level]
      properties:
        code: { type: string }
        label: { type: string }
        system: { type: string, enum: [RNID, ICCS] }
        level: { type: integer }
    CrimeCatalogSource:
      type: object
      required: [system, version, url, sha256, scope]
      properties:
        system: { type: string }
        version: { type: string }
        url: { type: string }
        sha256: { type: string }
        scope: { type: string }
    CrimeCatalog:
      type: object
      required: [version, warning, sources, entries]
      properties:
        version: { type: string }
        warning: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/CrimeCatalogSource" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CrimeCatalogEntry" }
    SealedRecord:
      type: object
      required: [kind, id, folio, createdAt, originalHash, status, entryCount, canWrite]
      properties:
        kind: { type: string, enum: [tactical, nexus] }
        id: { type: string }
        folio: { type: string }
        createdAt: { type: string }
        originalHash: { type: string }
        status: { type: string, enum: [registered, amended, cancellation_recorded] }
        entryCount: { type: integer }
        canWrite: { type: boolean }
    LedgerEntry:
      type: object
      required: [id, sequence, eventType, data, actor, createdAt, hash, previousHash, payloadHash, canonical]
      properties:
        id: { type: integer }
        sequence: { type: integer }
